<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="#0a0c14"/>
  <!-- browser chrome -->
  <rect width="1200" height="64" fill="#11141f"/>
  <circle cx="34" cy="32" r="7" fill="#2a2f3f"/><circle cx="58" cy="32" r="7" fill="#2a2f3f"/><circle cx="82" cy="32" r="7" fill="#2a2f3f"/>
  <rect x="300" y="16" width="600" height="32" rx="16" fill="#1a1e2c"/>
  <text x="600" y="37" text-anchor="middle" font-family="monospace" font-size="15" fill="#8b90a1">claimsight-demo.example.com</text>
  <!-- site nav -->
  <text x="80" y="132" font-family="Georgia,serif" font-size="26" fill="#f2f1ec">Claimsight</text>
  <rect x="960" y="108" width="160" height="40" rx="20" fill="url(#g)"/>
  <text x="1040" y="133" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">Get started</text>
  <g fill="#9b9c9f" font-family="sans-serif" font-size="15">
    <text x="620" y="132">Product</text><text x="720" y="132">Pricing</text><text x="820" y="132">About</text>
  </g>
  <!-- hero -->
  <rect y="64" width="1200" height="836" fill="url(#glow)"/>
  <text x="600" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="72" fill="#f2f1ec">Claims read in seconds</text>
  <text x="600" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="72" font-style="italic" fill="url(#g)">not hours</text>
  <rect x="450" y="500" width="300" height="8" rx="4" fill="#2a2f3f"/>
  <rect x="500" y="524" width="200" height="8" rx="4" fill="#232838"/>
  <rect x="510" y="580" width="180" height="52" rx="26" fill="url(#g)"/>
  <text x="600" y="612" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#ffffff">Book a demo</text>
  <!-- product card mock -->
  <rect x="200" y="690" width="800" height="210" rx="18" fill="#11141f" stroke="#232838"/>
  <rect x="236" y="726" width="220" height="12" rx="6" fill="#2a2f3f"/>
  <rect x="236" y="758" width="340" height="10" rx="5" fill="#232838"/>
  <rect x="236" y="784" width="300" height="10" rx="5" fill="#232838"/>
  <rect x="700" y="726" width="264" height="140" rx="12" fill="url(#g)" opacity="0.75"/>
</svg>